# Render 蓝图配置: 部署 Web3 安全事件分析平台 (Python Web 服务)
# 文档: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: web3-security
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATA_SOURCE
        value: defillama
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: FETCH_INTERVAL_SECONDS
        value: "3600"
      - key: FETCH_BATCH_SIZE
        value: "5"
      - key: FETCH_RETRY_TIMES
        value: "3"
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
      - key: SCHEDULER_TIMEZONE
        value: Asia/Shanghai
      # 使用 Render 托管 PostgreSQL 连接串 (持久化案例库, 重启不丢数据)
      - key: DATABASE_URL
        fromDatabase:
          name: web3-security-db
          property: connectionString

# Render 托管的 PostgreSQL 数据库 (免费实例, 持久化案例库)
databases:
  - name: web3-security-db
    plan: free
    databaseName: web3_security
    user: web3_security